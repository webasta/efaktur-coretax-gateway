services:
  efaktur-gateway:
    build: .
    image: efaktur-coretax-gateway:latest
    container_name: efaktur-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      # database.json & .app-secret tersimpan di folder ./data di host (wajib di-backup)
      - ./data:/app/data
    ports:
      # Default: hanya dari VPS sendiri (untuk Nginx reverse proxy).
      # Akses langsung dari luar: set HOST_BIND=0.0.0.0 dan HOST_PORT=3012 di .env
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
